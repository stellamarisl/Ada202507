<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Model Reunion Finalizada</title>
</head>
<body>
    <h1>Meeting Ended Modal</h1>
    <section class="cuerpo">
        <div class="contenedor">
            <div class="cerrar">
                <img src="assets/letra-x.png" alt="cerrar" class="cerrar-icono">
            </div>
            <div class="reunion">
                <p class="titulo-reunion">You left the meeting</p>
            </div>
            <div class="card">
                <p class="titulo-card">How was the quality of the call?</p>
                <div class="estrellas">
                    <img src="assets/estrella-removebg-preview.png" alt="estrella" class="estrella-completa">
                    <img src="assets/estrella-removebg-preview.png" alt="estrella" class="estrella-completa">
                    <img src="assets/estrella-removebg-preview.png" alt="estrella" class="estrella-completa">
                    <img src="assets/una estrella de cinc.png" alt="sinestrella" class="estrella-contorno">
                    <img src="assets/una estrella de cinc.png" alt="sinestrella" class="estrella-contorno">
                    
                </div>
                    <div class="clasificacion">
                        <span>Very bad</span>
                        <span>Excellent</span>
                    </div>
            </div>
            <div class="boton">
                <button class="return">Return Home</button>
            </div>
        
        <p class="join">Join again</p>
        </div>
    </section>
</body>
</html>
