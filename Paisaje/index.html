<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Paisaje</title>

<body>
    <!--Paisaje
index.html debe tener:

al menos 10 elementos en línea span, que deben contener cada uno un emoji (por ejemplo, de árboles y/o edificios). Por ejemplo:

🌲🌳🌳🏠🏢🏦🏠🏠🌲🌳
cada emoji debe tener un tamaño de letra distinto para que haya variedad entre ellos.-->
<span class="uno">🌲</span>
<span class="dos">🌳</span>
<span class="tres">🌳</span>
<span class="cuatro">🏠</span>
<span class="cinco">🏢</span>
<span class="seis">🏦</span>
<span class="siete">🏠</span>
<span class="ocho">🏠</span>
<span class="nueve">🌲</span>
<span class="diez">🌳</span>

</body>
</html>
