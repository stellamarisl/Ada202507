<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Tweet</title>
</head>
<body>
    <div class="contenedor">
        <div class="header">
            <div class="encabezado">
                <img src="assets/mujer.png" alt="Avatar de Ada Lovelace" title="Ada Lovelace" height="50" width="50" />
            </div>
            <div class="titulos">
                <h3 class="titulo">Ada Lovelace</h3>
                <h4 class="titulo1"> @adalove</h4>
            </div>
        </div>
        <div class="texto">
            The Analytical Engine has no pretensions whatever to originate anything. It can do whatever we know how to order
            it to perform.
        </div>
        <div class="fecha">
            2:32 PM - 12 Mayo de 1842
        </div>
        <hr class="division">

        <div class="footer">
            <div class="numeros">
                <div class="retweet">
                    <span class="nro-ret">203</span> Retweets
                </div>
                <div class="like">
                    <span class="nro-like">532</span> Likes
                </div>
            </div>
            <div class="links-der">
                <a href="#" class="item-der">Share</a>
                <a href="#" class="item-der">Retweet</a>
                <a href="#" class="item-der">Like</a>
        
            </div>
        </div>
    </div>
</body>
</html>
