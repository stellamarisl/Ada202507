<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Color Palette</title>
</head>
<body>
    <h2>Color Palette Generator</h2>
    <div class="contenedor">
        <div class="contenedor-primer-boton">
            <button class="primer-boton">Color#F9ACA7 copied to your clipboard</button>
        </div>
        <div class="segundo-titulo">
            <h3>Color palette generator</h3>
            <div class="contenedor-tarjetas">
                <div class="tarjeta-1">
                    <div class="paleta-1"></div>
                    <span class="codigo-1">#EEEDF0</span>
                </div>
                <div class="tarjeta-2">
                    <div class="paleta-2"></div>
                        <span class="codigo-2">#A1B5C1</span>
                </div>
                <div class="tarjeta-3">
                    <div class="paleta-3"></div>
                    <span class="codigo-3">#F9ACA7</span>
                </div>
                <div class="tarjeta-4">
                    <div class="paleta-4"></div>
                    <span class="codigo-4">#68747D</span>
                </div>
                <div class="tarjeta-5">
                    <div class="paleta-5"></div>
                    <span class="codigo-5">#CF365F</span>
                </div>
            </div>
        </div>
        <div class="boton-grande">
            <button class="boton-final">Generate palette</button>
        </div>
    <p class="parrafo-spacebar">Or just press the "Spacebar" to generate new palettes.</p>
    <div class="boton-copy">
        <button class="boton-boton-copy">Click to copy individual <img src="assets/circulo-negro.png" alt="punto" class="punto">Press "C" to copy palette</button>
    </div>
    </div>
</body>
</html>
