<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Ratings Card</title>
</head>
<body>
    <div class="titulo">
        <h1>Ratings Card</h1>
    </div>
        <div class="contenedor">
        <div class="card">
            <h3>Customer reviews</h3>
            <div class="ratings">
                <img src="assets/star.png" alt="estrella" class="estrella">
                <img src="assets/star.png" alt="estrella" class="estrella">
                <img src="assets/star.png" alt="estrella" class="estrella">
                <img src="assets/star.png" alt="estrella" class="estrella">
                <img src="assets/star.png" alt="estrella" class="estrella">
                <span class="ratings-texto">4.7 out of 5</span>
            </div>
            <p class="total-ratings">40 customer ratings</p>

            <div class="ratings-filas">
                <div class="star-barra">
                <span class="nro-estrella">5 star</span>
                <div class="barra">
                    <div class="barra-amarilla p84"></div>
                </div>
                <span class="porcentaje">84%</span>
                </div>
            </div>

            <div class="ratings-filas">
                <div class="star-barra">
                <span class="nro-estrella">4 star</span>
                <div class="barra">
                    <div class="barra-amarilla p9"></div>
                </div>
                <span class="porcentaje">9%</span>
                </div>
            </div>

            <div class="ratings-filas">
                <div class="star-barra">
                <span class="nro-estrella">3 star</span>
                <div class="barra">
                    <div class="barra-amarilla p4"></div>
                </div>
                <span class="porcentaje">4%</span>
                </div>
            </div>

            <div class="ratings-filas">
                <div class="star-barra">
                <span class="nro-estrella">2 star</span>
                <div class="barra">
                    <div class="barra-amarilla p2"></div>
                </div>
                <span class="porcentaje">2%</span>
                </div>
            </div>

            <div class="ratings-filas">
                <div class="star-barra">
                <span class="nro-estrella">1 star</span>
                <div class="barra">
                    <div class="barra-amarilla p1"></div>
                </div>
                <span class="porcentaje">1%</span>
                </div>
            </div>
            <span class="como">How do we calculate ratings?</span>
        </div>
        
    </div>
</body>
</html>
