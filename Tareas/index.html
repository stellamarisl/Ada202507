<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Tareas</title>
</head>
<body>
    <!--index.html debe tener:
un título h1 que diga: Mis tareas.
un título h2 que diga: Tareas para hoy.
agregar 6 tareas, que deben tener:
un título h3 con la tarea a realizar (por ejemplo Hacer las compras).
un elemento en línea span con el estado de la tarea: Pendiente, Haciendo, Hecha, Cancelada.
Ejemplo:
Mis tareas
Tareas para hoy
Ir al banco
Cancelada
Preparar parcial
Haciendo
Pasear al perro
Hecha
Poner un tipografía distinta a la default.
Dar a los títulos un tamaño de fuente distinto al default.
Dar a la fecha un tamaño de letra más pequeña y un color gris claro.
Poner a cada estado un color de fondo distinto, siguiendo el siguiente criterio:
Pendiente: Azul
Haciendo: Naranja
Hecha: Verde
Cancelada: <Rojo-->
<h1>Mis tareas</h1>
<h2>Tareas para hoy</h2>
<div class="contenedor">
    <div class="tarea-uno">
        <h3>Hacer las compras</h3>
        <span class="pendiente">Pendiente</span>
    </div>
    <div class="tarea-dos">
        <h3>Limpiar</h3>
        <span class="haciendo">Haciendo</span>
    </div>
    <div class="tarea-tres">
        <h3>Estudiar</h3>
        <span class="hecha">Hecha</span>
    </div>
    <div class="tarea-cuatro">
        <h3>Ir al banco</h3>
        <span class="cancelada">Cancelada</span>
    </div>
    <div class="tarea-cinco">
        <h3>Consulta al medico</h3>
        <span class="pendiente">Pendiente</span>
    </div>
    <div class="tarea-seis">
        <h3>Pasear al perro</h3>
        <span class="hecha">Hecha</span>
    </div>
</div>


</body>
</html>
