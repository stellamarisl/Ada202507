<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Share Modal</title>
</head>
<body>
    <h1>Share Modal</h1>
    <section class="contenedor">
        <div class="card">
            <div class="cerrar">
            <img src="assets/boton-x.png" alt="cerrar" class="cerrar-icono">
            </div>
            <div class="encabezado">
            <p class="titulo">Share this article</p>
            <p class="articulo">If you like this article share it with your friends.<br>They will thank you later.</p>
            </div>
            <div class="botones">
                <div class="facebook">
                <button class="facebook-boton"><img src="assets/facebook (1).png" alt="facebook" class="facebook-icono">Facebook</button>
                </div>
                <div class="x">
                <button class="x-boton"><img src="assets/gorjeo (1).png" alt="x" class="x-icono"></button>
                </div>
                <div class="reddit">
                <button class="reddit-boton"><img src="assets/logotipo-de-reddit.png" alt="reddit" class="reddit-icono">Reddit</button>
                </div>
            </div>
            <div class="datos">
            <span class="numero">4,5 K</span>
            <span class="share">Shares</span>
            </div>
            <div class="cierre">
            <p>Close this window</p>
            </div>
        </div>
    </section>
</body>
</html>
