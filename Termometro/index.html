<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Termometro</title>
</head>
<body>
    <!--index.html debe tener:

una lista desordenada con 10 ítems.

la lista debe ir de Temperatura: 0°C a Temperatura: 50°C aumentando de a 5°C.

poner las temperaturas extremas (0°C y 50°C) en negrita.

dar a cada temperatura un color distinto, cambiando gradualmente, siendo el 0°C el color azul y 50°C el color rojo.-->
    <ul class="termometro">
        <li class="cero">0°C</li>
        <li class="cinco">5°C</li>
        <li class="diez">10°</li>
        <li class="quince">15°</li>
        <li class="veinte">20°</li>
        <li class="veinticinco">25°</li>
        <li class="treinta">30°</li>
        <li class="treintaycinco">35°</li>
        <li class="cuarenta">40°</li>
        <li class="cincuenta">50°</li>
    </ul>
</body>
</html>
